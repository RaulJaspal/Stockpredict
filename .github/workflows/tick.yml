name: daily-tick

# Keeps the model learning while your Mac is off: once each weekday, log the
# watchlist, resolve matured predictions, update the weights, and commit the
# ledger + weights back to the repo (the git history is the persistent store).
on:
  schedule:
    - cron: "30 21 * * 1-5"     # 21:30 UTC, Mon-Fri (~1h after US market close)
  workflow_dispatch: {}          # also lets you (or Claude) trigger a run by hand

# Never let two ticks run at once (they'd both push and race).
concurrency:
  group: daily-tick
  cancel-in-progress: false

permissions:
  contents: write                # the job commits predictions.jsonl + model_state.json

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the daily tick (log -> resolve -> learn)
        run: python -m scripts.tick

      - name: Commit updated ledger + weights
        run: |
          git config user.name "stockpredict-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.jsonl model_state.json
          if git diff --cached --quiet; then
            echo "nothing new to commit (already logged today / market closed)"
          else
            git commit -m "tick: $(date -u +'%Y-%m-%d %H:%M UTC') — log, resolve, learn"
            git push
          fi
